---
# Configuration for the k3s server, written to /etc/rancher/k3s/config.yaml
# Keys are the k3s server flags without the leading dashes
# Lists are merged with the defaults, e.g. 'disable' entries are added to traefik
k3s_server_config_defaults: >-
  {{ {} if k3s_traefik_enabled else {'disable': ['traefik']} }}
# Operator-supplied configuration, e.g.
#   k3s_server_config_overrides:
#     cluster-cidr: 10.42.0.0/16,fd42:42::/56
#     service-cidr: 10.43.0.0/16,fd42:43::/112
# Note that dual-stack can only be enabled when the cluster is created
k3s_server_config_overrides: {}
k3s_server_config: >-
  {{-
    k3s_server_config_defaults |
      combine(k3s_server_config_overrides, recursive=True, list_merge='append_rp')
  }}

k3s_repo: https://github.com/k3s-io/k3s
k3s_version: v1.35.8+k3s1
k3s_architecture: "{{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}"
k3s_binary_name: "{{ 'k3s' if ansible_architecture == 'x86_64' else 'k3s-' ~ k3s_architecture }}"
k3s_binary_url: "{{ k3s_repo }}/releases/download/{{ k3s_version }}/{{ k3s_binary_name }}"
k3s_binary_checksum_url: "{{ k3s_repo }}/releases/download/{{ k3s_version }}/sha256sum-{{ k3s_architecture }}.txt"
k3s_binary_checksum_regex: "{{ '.+' ~ k3s_binary_name ~ '$' }}"
k3s_binary_checksum: "sha256:{{ lookup('url', k3s_binary_checksum_url, wantlist=True) | select('match', k3s_binary_checksum_regex) | first | split | first }}"

# Settings for an additional block device that will hold the k3s state, if present
k3s_storage_device: /dev/sdb
k3s_storage_fstype: xfs

# Indicates if the Traefik ingress controller should be enabled
k3s_traefik_enabled: false

# Variable to disable filesystem setup (for running on existing systems)
k3s_configure_filesystem: true

# Additional APT packages to install on the seed host
k3s_admin_packages:
  - jq
  - yq
