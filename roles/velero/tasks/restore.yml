---
- name: Check status of target backup
  ansible.builtin.command: >-
    kubectl get backup {{ velero_restore_backup_name }}
      --namespace {{ velero_release_namespace }}
      --output jsonpath='{.status.phase}'
  changed_when: false
  register: velero_target_backup_check
  until: velero_target_backup_check.rc == 0
  retries: 18
  delay: 10

- name: Fail if target backup is not in an allowable state
  ansible.builtin.fail:
    msg: "Aborting restore of backup in state '{{ velero_target_backup_check.stdout }}'"
  when: >-
    velero_target_backup_check.stdout != "Completed" and
    (not velero_restore_allow_partial or velero_target_backup_check.stdout != "PartiallyFailed")

- name: Apply restore config
  ansible.builtin.command: kubectl apply -f -
  args:
    stdin: "{{ velero_restore_definition | to_nice_yaml }}"
  vars:
    velero_restore_definition:
      apiVersion: velero.io/v1
      kind: Restore
      metadata:
        name: "{{ velero_restore_name }}"
        namespace: "{{ velero_release_namespace }}"
      spec: "{{ velero_restore_spec }}"
  register: kubectl_velero_restore_conf
  changed_when: kubectl_velero_restore_conf.stdout_lines | select('match', '(?!.*unchanged$)') | length > 0

- name: Wait for restore to complete
  block:
    # Wait for the restore to reach any terminal phase, so that we fail fast
    # if the restore fails instead of waiting for it to become Completed
    - name: Wait for restore to finish
      ansible.builtin.command: >-
        kubectl get restores.velero.io/{{ velero_restore_name }}
          --namespace {{ velero_release_namespace }}
          --output jsonpath='{.status.phase}'
      changed_when: false
      register: velero_restore_phase
      until: >-
        velero_restore_phase is succeeded and
        velero_restore_phase.stdout in velero_restore_terminal_phases
      retries: 360
      delay: 10

    - name: Fail if restore did not complete successfully
      ansible.builtin.fail:
        msg: "Restore finished in state '{{ velero_restore_phase.stdout }}'"
      when: velero_restore_phase.stdout != "Completed"

  rescue:
    - name: Get restore details
      ansible.builtin.command: >-
        velero restore describe {{ velero_restore_name }}
          --namespace {{ velero_release_namespace }}
          --details
      changed_when: false
      failed_when: false
      register: velero_restore_describe

    - name: Show restore details
      ansible.builtin.debug:
        var: velero_restore_describe.stdout_lines

    - name: Fail because restore did not complete
      ansible.builtin.fail:
        msg: >-
          Restore {{ velero_restore_name }} did not complete
          (phase: '{{ velero_restore_phase.stdout | default("unknown") }}').
