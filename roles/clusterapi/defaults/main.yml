---

# Helm chart information for the Cluster API operator
clusterapi_operator_chart_repo: https://kubernetes-sigs.github.io/cluster-api-operator
clusterapi_operator_chart_name: cluster-api-operator
clusterapi_operator_chart_version: 0.29.0

# Release information for the Cluster API operator release
clusterapi_operator_release_namespace: capi-operator-system
clusterapi_operator_release_name: cluster-api-operator

# The timeout to wait for the Cluster API operator to become ready
clusterapi_operator_wait_timeout: 10m

# The values for the Cluster API operator release
clusterapi_operator_release_defaults: {}
clusterapi_operator_release_overrides: {}
clusterapi_operator_release_values: >-
  {{-
    clusterapi_operator_release_defaults |
      combine(clusterapi_operator_release_overrides, recursive = True)
  }}

# The versions of the Cluster API providers managed by the operator
clusterapi_core_version: v1.14.2
clusterapi_openstack_version: v0.14.8

# The repo, version and manifest URL for the OpenStack Resource Controller components
# ORC is not a Cluster API provider, so it is not managed by the operator
clusterapi_openstack_resource_controller_repo: https://github.com/k-orc/openstack-resource-controller
clusterapi_openstack_resource_controller_version: v2.6.0
clusterapi_openstack_resource_controller_components: >-
  {{ clusterapi_openstack_resource_controller_repo }}/releases/download/{{ clusterapi_openstack_resource_controller_version }}/install.yaml

# The diagnostics address for Cluster API components
clusterapi_diagnostics_address: 0.0.0.0:8443
clusterapi_insecure_diagnostics: false

# The namespace and diagnostics address for CAPO components
clusterapi_openstack_namespace: capo-system
clusterapi_openstack_metrics: true
clusterapi_openstack_diagnostics_address: >-
  {{ '0.0.0.0:8080' if clusterapi_openstack_metrics else '127.0.0.1:8080' }}
clusterapi_openstack_insecure_diagnostics: true

# Variables for toggling feature gates for experimental features
clusterapi_feature_gate_machine_pool: false
clusterapi_feature_gate_cluster_topology: true
clusterapi_feature_gate_runtime_sdk: true
clusterapi_feature_gate_machine_set_preflight_checks: true
clusterapi_feature_gate_kubeadm_bootstrap_format_ignition: false
clusterapi_feature_gate_openstack_priority_queue: true
clusterapi_feature_gate_openstack_autoscale_from_zero: true

clusterapi_core_feature_gates:
  MachinePool: "{{ clusterapi_feature_gate_machine_pool | bool }}"
  ClusterTopology: "{{ clusterapi_feature_gate_cluster_topology | bool }}"
  RuntimeSDK: "{{ clusterapi_feature_gate_runtime_sdk | bool }}"
  MachineSetPreflightChecks: "{{ clusterapi_feature_gate_machine_set_preflight_checks | bool }}"
clusterapi_openstack_feature_gates:
  PriorityQueue: "{{ clusterapi_feature_gate_openstack_priority_queue | bool }}"
  AutoScaleFromZero: "{{ clusterapi_feature_gate_openstack_autoscale_from_zero | bool }}"
clusterapi_kubeadm_bootstrap_feature_gates:
  MachinePool: "{{ clusterapi_feature_gate_machine_pool | bool }}"
  KubeadmBootstrapFormatIgnition: "{{ clusterapi_feature_gate_kubeadm_bootstrap_format_ignition | bool }}"
clusterapi_kubeadm_control_plane_feature_gates:
  ClusterTopology: "{{ clusterapi_feature_gate_cluster_topology | bool }}"
  KubeadmBootstrapFormatIgnition: "{{ clusterapi_feature_gate_kubeadm_bootstrap_format_ignition | bool }}"

# The manager configuration shared by the core, bootstrap and control plane providers
clusterapi_manager_metrics:
  diagnosticsAddress: "{{ clusterapi_diagnostics_address }}"
  insecureDiagnostics: "{{ clusterapi_insecure_diagnostics | bool }}"

# Additional patches applied when metrics are enabled (expose the metrics port on the CAPO pod)
clusterapi_openstack_metrics_patches:
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/ports/-
        value:
          containerPort: 8080
          name: metrics
          protocol: TCP
    target:
      kind: Deployment
      name: capo-controller-manager

# The provider resources that are reconciled by the Cluster API operator
# yamllint disable rule:line-length
clusterapi_providers:
  - apiVersion: operator.cluster.x-k8s.io/v1alpha2
    kind: CoreProvider
    metadata:
      name: cluster-api
      namespace: capi-system
    spec:
      version: "{{ clusterapi_core_version }}"
      manager:
        metrics: "{{ clusterapi_manager_metrics }}"
        featureGates: "{{ clusterapi_core_feature_gates }}"
  - apiVersion: operator.cluster.x-k8s.io/v1alpha2
    kind: BootstrapProvider
    metadata:
      name: kubeadm
      namespace: capi-kubeadm-bootstrap-system
    spec:
      version: "{{ clusterapi_core_version }}"
      manager:
        metrics: "{{ clusterapi_manager_metrics }}"
        featureGates: "{{ clusterapi_kubeadm_bootstrap_feature_gates }}"
  - apiVersion: operator.cluster.x-k8s.io/v1alpha2
    kind: ControlPlaneProvider
    metadata:
      name: kubeadm
      namespace: capi-kubeadm-control-plane-system
    spec:
      version: "{{ clusterapi_core_version }}"
      manager:
        metrics: "{{ clusterapi_manager_metrics }}"
        featureGates: "{{ clusterapi_kubeadm_control_plane_feature_gates }}"
  - apiVersion: operator.cluster.x-k8s.io/v1alpha2
    kind: InfrastructureProvider
    metadata:
      name: openstack
      namespace: "{{ clusterapi_openstack_namespace }}"
    spec:
      version: "{{ clusterapi_openstack_version }}"
      manager:
        verbosity: 2
        metrics:
          diagnosticsAddress: "{{ clusterapi_openstack_diagnostics_address }}"
          insecureDiagnostics: "{{ clusterapi_openstack_insecure_diagnostics | bool }}"
        featureGates: "{{ clusterapi_openstack_feature_gates }}"
      patches: "{{ clusterapi_openstack_metrics_patches if clusterapi_openstack_metrics else [] }}"
# yamllint enable rule:line-length

# The kustomization to use for the non-provider components (ORC)
clusterapi_kustomization:
  resources:
    - "{{ clusterapi_openstack_resource_controller_components }}"

# Use a directory in $HOME for the kustomization by default
clusterapi_kustomization_directory: "{{ (ansible_env.HOME, 'clusterapi') | path_join }}"

# List of CAPO CRD resource types that may need stored version migration during upgrades
clusterapi_capo_crds:
  - openstackclusters
  - openstackclustertemplates
  - openstackmachines
  - openstackmachinetemplates

# The timeout to wait for each provider to reach the requested version
clusterapi_provider_wait_timeout: 10m

# List of resources to watch for completeness
clusterapi_watches:
  - kind: deployment
    namespace: capi-system
    name: capi-controller-manager
    condition: Available
  - kind: deployment
    namespace: capi-kubeadm-bootstrap-system
    name: capi-kubeadm-bootstrap-controller-manager
    condition: Available
  - kind: deployment
    namespace: capi-kubeadm-control-plane-system
    name: capi-kubeadm-control-plane-controller-manager
    condition: Available
  - kind: deployment
    namespace: "{{ clusterapi_openstack_namespace }}"
    name: capo-controller-manager
    condition: Available

# Helm chart information for the Cluster API addon provider
clusterapi_addon_provider_chart_repo: https://azimuth-cloud.github.io/cluster-api-addon-provider
clusterapi_addon_provider_chart_name: cluster-api-addon-provider
clusterapi_addon_provider_chart_version: 0.15.1

# Release information for the Cluster API addon provider release
clusterapi_addon_provider_release_namespace: capi-addon-system
clusterapi_addon_provider_release_name: cluster-api-addon-provider

# The timeout to wait for the Cluster API addon provider to become ready
clusterapi_addon_provider_wait_timeout: 30m

# The trust bundle to use with the Cluster API addon provider
# This allows for pulling charts from places using a custom CA for TLS
clusterapi_addon_provider_trust_bundle: "{{ system_trust_ca_bundle | default('') }}"

# The values for the Cluster API addon provider deployment
# The defaults are sufficient for most use cases
clusterapi_addon_provider_release_defaults:
  trustBundle: "{{ clusterapi_addon_provider_trust_bundle }}"
clusterapi_addon_provider_release_overrides: {}
clusterapi_addon_provider_release_values: >-
  {{-
    clusterapi_addon_provider_release_defaults |
      combine(clusterapi_addon_provider_release_overrides, recursive = True)
  }}

# Helm chart information for the Cluster API janitor
clusterapi_janitor_openstack_chart_repo: https://azimuth-cloud.github.io/cluster-api-janitor-openstack
clusterapi_janitor_openstack_chart_name: cluster-api-janitor-openstack
clusterapi_janitor_openstack_chart_version: 0.16.0

# Release information for the Cluster API janitor release
clusterapi_janitor_openstack_release_namespace: capi-janitor-system
clusterapi_janitor_openstack_release_name: cluster-api-janitor-openstack

# The timeout to wait for the Cluster API janitor to become ready
clusterapi_janitor_openstack_wait_timeout: 30m

# The values for the Cluster API janitor deployment
# The defaults are sufficient for most use cases
clusterapi_janitor_openstack_release_values: {}
