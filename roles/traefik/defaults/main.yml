---
### nginx ###
# ingress-nginx serves all traffic and Traefik is not installed
# If traefik exists, it is removed.

### traefik ###
# * Install traefik
# * Verify
# * Move ingress-nginx service to point at traefic
# * Remove ingress-nginx (optionally)

# For a fresh install, Traefik is installed directly into its own namespace,
# with a LB Service from the chart

# Moving from traefik back to nginx is supported until ingress-nginx is removed
# Migration phase is set by ingress_controller_migration_phase (default nginx), which also
# controls whether the playbooks install ingress-nginx

# The chart to use
traefik_chart_repo: https://traefik.github.io/charts
traefik_chart_name: traefik
traefik_chart_version: 41.7.1

# The chart to use for the Traefik CRDs
traefik_crds_chart_repo: https://traefik.github.io/charts
traefik_crds_chart_name: traefik-crds
traefik_crds_chart_version: 1.18.0

traefik_release_name: traefik
# The namespace for fresh installs
traefik_namespace: traefik
# The namespace for installs that are migrated from ingress-nginx
# MUST BE the namespace of ingress-nginx, because we need to adopt it's service
traefik_migration_namespace: "{{ traefik_ingress_nginx_release_namespace }}"

# The namespace that Traefik is installed into
traefik_release_namespace: "{{ traefik_detected_release_namespace }}"
traefik_crds_release_name: traefik-crds

traefik_wait_timeout: 10m

# Release information for the ingress-nginx release that is being migrated from
traefik_ingress_nginx_release_namespace: ingress-nginx
traefik_ingress_nginx_release_name: ingress-nginx

# Indicates whether ingress-nginx should be uninstalled in the traefik phase
# By default, ingress-nginx is left running
# Once ingress-nginx is uninstalled, rolling back is a manual operation
traefik_ingress_nginx_remove: false

# IngressClass that the ingress-nginx compatibility provider serves
traefik_ingress_nginx_class_name: nginx
traefik_ingress_nginx_controller_class: k8s.io/ingress-nginx

# LB service created by the chart for fresh installs.
# For migrated installs, the ingress-nginx Service is taken over by the Traefik release
# once ingress-nginx is removed
traefik_service_from_chart: "{{ traefik_release_namespace != traefik_migration_namespace }}"

# The LoadBalancer Service that receives external traffic
traefik_service_name: >-
  {{-
    traefik_chart_service_name
    if traefik_service_from_chart
    else "{}-controller".format(traefik_ingress_nginx_release_name)
  }}

# The IP to request for the load balancer, if required
traefik_service_load_balancer_ip:

# Annotations for the Service
traefik_service_annotations:
  loadbalancer.openstack.org/keep-floatingip: "true"

# Labels for the Service when it is taken over from ingress-nginx
traefik_service_labels:
  app.kubernetes.io/name: traefik

# The ports for the Service, pointing at the Traefik entrypoints
# Names and ports to match the ingress-nginx controller Service
traefik_service_ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: web
  - name: https
    port: 443
    protocol: TCP
    targetPort: websecure
# The ports for the Service when pointing at ingress-nginx, used for rollback
traefik_ingress_nginx_service_ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  - name: https
    port: 443
    protocol: TCP
    targetPort: https

# The labels that select the Traefik pods
traefik_pod_selector:
  app.kubernetes.io/name: "{{ traefik_chart_name }}"
  app.kubernetes.io/instance: "{{ traefik_release_name }}-{{ traefik_release_namespace }}"

# The name of the ClusterIP Service created by the Traefik chart
traefik_chart_service_name: >-
  {{-
    traefik_release_name
    if traefik_chart_name in traefik_release_name
    else "{}-{}".format(traefik_release_name, traefik_chart_name)
  }}

# The port of the traefik entrypoint, which serves the API
traefik_api_port: 8080

# The Service and IngressClass that the Traefik release manages once ingress-nginx is not installed
# While ingress-nginx is installed, they belong to the ingress-nginx release
traefik_ingress_controller_objects: >-
  {{-
    []
    if traefik_ingress_nginx_installed
    else (
      ([] if traefik_service_from_chart else [traefik_service_definition]) +
      [traefik_ingress_nginx_class_definition]
    )
  }}
traefik_service_definition:
  apiVersion: v1
  kind: Service
  metadata:
    name: "{{ traefik_service_name }}"
    namespace: "{{ traefik_release_namespace }}"
    labels: "{{ traefik_service_labels }}"
    annotations: "{{ traefik_service_annotations }}"
  spec: >-
    {{-
      {
        "type": "LoadBalancer",
        "selector": traefik_pod_selector,
        "ports": traefik_service_ports,
      } |
        combine(
          { "loadBalancerIP": traefik_service_load_balancer_ip }
          if traefik_service_load_balancer_ip
          else {}
        )
    }}
traefik_ingress_nginx_class_definition:
  apiVersion: networking.k8s.io/v1
  kind: IngressClass
  metadata:
    name: "{{ traefik_ingress_nginx_class_name }}"
  spec:
    controller: "{{ traefik_ingress_nginx_controller_class }}"

# The number of Traefik replicas
traefik_replicas: "{{ 2 if (install_mode | default('singlenode')) == 'ha' else 1 }}"

traefik_tls_redirect_enabled: "{{ ingress_tls_enabled | default(true) }}"

traefik_prometheus_stack_enabled: "{{ ingress_nginx_prometheus_stack_enabled | default(true) }}"

traefik_access_log_enabled: true

# Enable check and rollback
traefik_verify_enabled: true

traefik_verify_probe_urls: >-
  {{-
    [
      "{}://{}.{}/api/".format(
        "https" if traefik_tls_redirect_enabled else "http",
        ingress_azimuth_portal_subdomain | default("portal"),
        ingress_base_domain
      )
    ]
    if ingress_base_domain is defined
    else []
  }}

traefik_verify_probe_status_codes:
  - 200
  - 301
  - 302
  - 307
  - 308
  - 401
  - 403

traefik_verify_retries: 12
traefik_verify_delay: 5

# The values for the traefik release
traefik_release_defaults:
  # Must be passed through to the values as an int.
  deployment: "{{ {'replicas': traefik_replicas | int} }}"
  podDisruptionBudget:
    enabled: "{{ traefik_replicas | int > 1 }}"
    maxUnavailable: 1
  affinity: >-
    {{-
      {
        "podAntiAffinity": {
          "preferredDuringSchedulingIgnoredDuringExecution": [
            {
              "weight": 100,
              "podAffinityTerm": {
                "topologyKey": "kubernetes.io/hostname",
                "labelSelector": {
                  "matchLabels": traefik_pod_selector,
                },
              },
            },
          ],
        },
      }
      if traefik_replicas | int > 1
      else {}
    }}
  ingressClass:
    # Traefik must not claim Ingresses that do not specify a class
    isDefaultClass: false

  # Enable the nginx provider and the kubernetes provider
  providers:
    kubernetesIngress:
      publishedService:
        pathOverride: "{{ traefik_release_namespace }}/{{ traefik_service_name }}"

    # Serves the existing nginx-class Ingresses
    kubernetesIngressNGINX:
      enabled: true
      ingressClassByName: true
      allowSnippetAnnotations: true
      publishService:
        enabled: true
        pathOverride: "{{ traefik_release_namespace }}/{{ traefik_service_name }}"

  # For a migrated install, the Service created by the chart is only used internally
  service: >-
    {{-
      {
        "annotations": traefik_service_annotations,
        "spec": (
          { "type": "LoadBalancer" } |
            combine(
              { "loadBalancerIP": traefik_service_load_balancer_ip }
              if traefik_service_load_balancer_ip
              else {}
            )
        ),
      }
      if traefik_service_from_chart
      else { "spec": { "type": "ClusterIP" } }
    }}

  ports:
    web:
      http:
        redirections:
          entryPoint: >-
            {{-
              {
                "to": "websecure",
                "scheme": "https",
                "permanent": True,
                "priority": 1,
              }
              if traefik_tls_redirect_enabled
              else {}
            }}
      transport:
        respondingTimeouts:
          readTimeout: 600
          writeTimeout: 600
          idleTimeout: 600
    websecure:
      transport:
        respondingTimeouts:
          readTimeout: 600
          writeTimeout: 600
          idleTimeout: 600

  extraObjects: "{{ traefik_ingress_controller_objects }}"

  # Only exposed on the traefik entrypoint of the pods
  # Used for verification
  api:
    insecure: "{{ traefik_verify_enabled }}"
  accessLog:
    enabled: "{{ traefik_access_log_enabled }}"
  metrics:
    prometheus:
      service:
        enabled: "{{ traefik_prometheus_stack_enabled }}"
      serviceMonitor:
        enabled: "{{ traefik_prometheus_stack_enabled }}"

traefik_release_overrides: {}
traefik_release_values: >-
  {{-
    traefik_release_defaults |
      combine(traefik_release_overrides, recursive = True)
  }}

# The values for the CRDs release
# The chart defaults install only the Traefik CRDs
traefik_crds_release_overrides: {}
traefik_crds_release_values: "{{ traefik_crds_release_overrides }}"
