---
# Migration phase, from ingress_controller_migration_phase:
# * nginx: ingress-nginx serves all traffic, and Traefik is removed if installed
# * traefik: Traefik serves all traffic.
#     If ingress-nginx is installed, Traefik is installed alongside nginx
#     with a ClusterIP Service, then ingress-nginx is removed and Traefik
#     takes over the load balancer.
traefik_phase: "{{ ingress_controller_migration_phase | default('nginx') }}"

traefik_chart_repo: https://traefik.github.io/charts
traefik_chart_name: traefik
traefik_chart_version: 41.7.1

# The chart to use for the Traefik CRDs
traefik_crds_chart_repo: https://traefik.github.io/charts
traefik_crds_chart_name: traefik-crds
traefik_crds_chart_version: 1.18.0

traefik_release_name: traefik
traefik_release_namespace: traefik
traefik_crds_release_name: traefik-crds

traefik_wait_timeout: 10m

# Release information for the ingress-nginx release that is being migrated from
traefik_ingress_nginx_release_namespace: ingress-nginx
traefik_ingress_nginx_release_name: ingress-nginx
traefik_ingress_nginx_service_name: "{{ traefik_ingress_nginx_release_name }}-controller"

# The name of the Service created by the Traefik chart
traefik_service_name: >-
  {{-
    traefik_release_name
    if traefik_chart_name in traefik_release_name
    else "{}-{}".format(traefik_release_name, traefik_chart_name)
  }}

# The IP to request for the load balancer, if required
traefik_service_load_balancer_ip:

# How long to wait for a Service to get or release a load balancer
traefik_load_balancer_retries: 60
traefik_load_balancer_delay: 5

# The labels that select the Traefik pods
traefik_pod_selector:
  app.kubernetes.io/name: "{{ traefik_chart_name }}"
  app.kubernetes.io/instance: "{{ traefik_release_name }}-{{ traefik_release_namespace }}"

# The Service whose address is published in the Ingress statuses
traefik_published_service: >-
  {{-
    "{}/{}".format(traefik_release_namespace, traefik_service_name)
    if traefik_serving
    else "{}/{}".format(traefik_ingress_nginx_release_namespace, traefik_ingress_nginx_service_name)
  }}

# The number of Traefik replicas
traefik_replicas: 1

traefik_tls_redirect_enabled: "{{ ingress_tls_enabled | default(true) }}"

traefik_access_log_enabled: true

# The values for the traefik release
traefik_release_defaults:
  # Must be passed through to the values as an int.
  deployment: "{{ {'replicas': traefik_replicas | int} }}"
  ingressClass:
    # Traefik must not claim Ingresses that do not specify a class
    isDefaultClass: false

  providers:
    kubernetesIngress:
      publishedService:
        pathOverride: "{{ traefik_published_service }}"

    # Serves the existing nginx-class Ingresses
    kubernetesIngressNGINX:
      enabled: true
      ingressClassByName: true
      allowSnippetAnnotations: true
      publishService:
        enabled: true
        pathOverride: "{{ traefik_published_service }}"

  # While ingress-nginx is serving, Traefik only has a ClusterIP Service
  service:
    annotations:
      loadbalancer.openstack.org/keep-floatingip: "true"
    spec: >-
      {{-
        {"type": "LoadBalancer", "loadBalancerIP": traefik_service_load_balancer_ip}
        if traefik_serving
        else {"type": "ClusterIP"}
      }}

  ports:
    web:
      http:
        redirections:
          entryPoint: >-
            {{-
              {
                "to": "websecure",
                "scheme": "https",
                "permanent": True,
                "priority": 1,
              }
              if traefik_tls_redirect_enabled
              else {}
            }}
      transport:
        respondingTimeouts: &traefik_responding_timeouts
          readTimeout: 600
          writeTimeout: 600
          idleTimeout: 600
    websecure:
      transport:
        respondingTimeouts: *traefik_responding_timeouts

  # The ingress-nginx IngressClass belongs to the ingress-nginx release while it is installed
  extraObjects: >-
    {{-
      [
        {
          "apiVersion": "networking.k8s.io/v1",
          "kind": "IngressClass",
          "metadata": {"name": "nginx"},
          "spec": {"controller": "k8s.io/ingress-nginx"},
        }
      ]
      if traefik_serving
      else []
    }}

  accessLog:
    enabled: "{{ traefik_access_log_enabled }}"

traefik_release_overrides: {}
traefik_release_values: >-
  {{-
    traefik_release_defaults |
      combine(traefik_release_overrides, recursive = True)
  }}
