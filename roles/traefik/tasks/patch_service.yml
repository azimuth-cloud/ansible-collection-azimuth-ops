---
- name: Get ingress-nginx controller Deployment
  ansible.builtin.command: >-
    kubectl get deployment {{ traefik_ingress_nginx_release_name }}-controller
      --namespace {{ traefik_ingress_nginx_release_namespace }}
      --output json
  changed_when: false
  register: traefik_ingress_nginx_deployment
  when: traefik_service_patch_target == 'ingress-nginx'

- name: Patch selector and targetPorts of the ingress controller Service
  ansible.builtin.command:
    argv:
      - kubectl
      - patch
      - service
      - "{{ traefik_service_name }}"
      - --namespace
      - "{{ traefik_release_namespace }}"
      - --type
      - strategic
      - --patch
      - "{{ traefik_service_patch | to_json }}"
  vars:
    traefik_service_patch_selector: >-
      {{
        traefik_pod_selector
        if traefik_service_patch_target == 'traefik'
        else (traefik_ingress_nginx_deployment.stdout | from_json).spec.selector.matchLabels
      }}
    traefik_service_patch_ports: >-
      {{
        traefik_service_ports
        if traefik_service_patch_target == 'traefik'
        else traefik_ingress_nginx_service_ports
      }}
    traefik_service_patch:
      spec:
        # Selector keys that are not in the new selector must be removed explicitly
        selector: >-
          {{
            traefik_service.spec.selector |
              default({}) |
              dict2items |
              map('combine', {'value': None}) |
              items2dict |
              combine(traefik_service_patch_selector)
          }}
        # Ports are merged by port number, so the nodePorts are kept
        ports: "{{ traefik_service_patch_ports }}"
    traefik_service_current_target_ports: >-
      {{
        traefik_service.spec.ports |
          selectattr('port', 'in', traefik_service_patch_ports | map(attribute = 'port')) |
          items2dict(key_name = 'port', value_name = 'targetPort')
      }}
    traefik_service_patch_target_ports: >-
      {{ traefik_service_patch_ports | items2dict(key_name = 'port', value_name = 'targetPort') }}
  when: >-
    traefik_service.spec.selector | default({}) != traefik_service_patch_selector or
    traefik_service_current_target_ports != traefik_service_patch_target_ports
  register: traefik_service_patch_cmd
  changed_when: true

- name: Update ingress controller Service state
  ansible.builtin.include_tasks: state.yml
  when: traefik_service_patch_cmd is not skipped
