---
- name: Verify Traefik before the cutover
  ansible.builtin.include_tasks: verify.yml
  when: traefik_verify_enabled

- name: Uninstall ingress-nginx
  kubernetes.core.helm:
    release_namespace: "{{ traefik_ingress_nginx_release_namespace }}"
    release_name: "{{ traefik_ingress_nginx_release_name }}"
    release_state: absent
    wait: true
    wait_timeout: "{{ traefik_wait_timeout }}"
  when: not traefik_capi_addon | bool

- name: Remove the ingress-nginx addon
  ansible.builtin.include_tasks: capi_addons.yml
  vars:
    traefik_capi_ingress_nginx_enabled: false
    traefik_capi_traefik_enabled: true
  when: traefik_capi_addon | bool

- name: Wait for ingress-nginx to release the load balancer
  ansible.builtin.include_tasks: wait_released.yml
  vars:
    traefik_released:
      namespace: "{{ traefik_ingress_nginx_release_namespace }}"
      name: "{{ traefik_ingress_nginx_service_name }}"

- name: Move the load balancer to Traefik and roll back on failure
  block:
    - name: Expose Traefik with a LoadBalancer Service
      ansible.builtin.set_fact:
        traefik_serving: true

    - name: Update Traefik release
      ansible.builtin.include_tasks: release.yml

    - name: Verify Traefik after the cutover
      ansible.builtin.include_tasks: verify.yml
      when: traefik_verify_enabled

  rescue:
    - name: Stop exposing Traefik with a LoadBalancer Service
      ansible.builtin.set_fact:
        traefik_serving: false

    - name: Update Traefik release
      ansible.builtin.include_tasks: release.yml

    - name: Wait for Traefik to release the load balancer
      ansible.builtin.include_tasks: wait_released.yml
      vars:
        traefik_released:
          namespace: "{{ traefik_release_namespace }}"
          name: "{{ traefik_service_name }}"

    - name: Reinstall ingress-nginx
      ansible.builtin.include_role:
        name: azimuth_cloud.azimuth_ops.ingress_nginx
      vars:
        ingress_nginx_release_name: "{{ traefik_ingress_nginx_release_name }}"
        ingress_nginx_release_namespace: "{{ traefik_ingress_nginx_release_namespace }}"
      when: not traefik_capi_addon | bool

    - name: Reinstall the ingress-nginx addon
      ansible.builtin.include_tasks: capi_addons.yml
      vars:
        traefik_capi_ingress_nginx_enabled: true
        traefik_capi_traefik_enabled: true
      when: traefik_capi_addon | bool

    - name: Fail after rolling back the cutover
      ansible.builtin.fail:
        msg: >-
          Moving the load balancer to Traefik failed, so ingress-nginx has been reinstalled
          and is serving all requests again. Deploy in the nginx phase to remove Traefik.

- name: Remove ingress-nginx alerting rules
  ansible.builtin.command: >-
    kubectl delete prometheusrule/nginx-ingress-alerting-rules
      --namespace {{ traefik_ingress_nginx_release_namespace }}
      --ignore-not-found
  register: traefik_delete_ingress_nginx_rules
  changed_when: "'deleted' in traefik_delete_ingress_nginx_rules.stdout"
  when: traefik_prometheus_stack_enabled
