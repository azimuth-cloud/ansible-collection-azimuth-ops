---
# Once ingress-nginx is removed, the Traefik release takes over the Service and IngressClass
# that were kept when it was uninstalled
- name: Get ingress controller objects
  ansible.builtin.command:
    argv: >-
      {{
        ["kubectl", "get", item.kind | lower, item.metadata.name] +
        (["--namespace", item.metadata.namespace] if item.metadata.namespace is defined else []) +
        ["--ignore-not-found", "--output", "json"]
      }}
  loop: "{{ traefik_ingress_controller_objects }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"
  changed_when: false
  register: traefik_ingress_controller_objects_cmd

- name: Hand over ingress controller objects to the Traefik release
  ansible.builtin.command:
    argv: >-
      {{
        ["kubectl", "patch", item.kind | lower, item.metadata.name] +
        (["--namespace", item.metadata.namespace] if item.metadata.namespace is defined else []) +
        ["--type", "merge", "--patch", traefik_handover_patch | to_json]
      }}
  loop: >-
    {{
      traefik_ingress_controller_objects_cmd.results |
        map(attribute = 'stdout') |
        select |
        map('from_json') |
        list
    }}
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"
  when: >-
    traefik_handover_annotations['meta.helm.sh/release-name'] | default('') != traefik_release_name or
    traefik_handover_annotations['meta.helm.sh/release-namespace'] | default('') != traefik_release_namespace
  vars:
    traefik_handover_annotations: "{{ item.metadata.annotations | default({}) }}"
    traefik_handover_patch:
      metadata:
        # Remove the labels added by ingress-nginx, the release adds its own
        labels: >-
          {{
            item.metadata.labels |
              default({}) |
              dict2items |
              map('combine', {'value': None}) |
              items2dict |
              combine({'app.kubernetes.io/managed-by': 'Helm'})
          }}
        annotations:
          meta.helm.sh/release-name: "{{ traefik_release_name }}"
          meta.helm.sh/release-namespace: "{{ traefik_release_namespace }}"
          helm.sh/resource-policy: null
  changed_when: true

- name: Install Traefik on target Kubernetes cluster
  kubernetes.core.helm:
    chart_ref: "{{ traefik_chart_name }}"
    chart_repo_url: "{{ traefik_chart_repo }}"
    chart_version: "{{ traefik_chart_version }}"
    release_namespace: "{{ traefik_release_namespace }}"
    release_name: "{{ traefik_release_name }}"
    release_values: "{{ traefik_release_values }}"
    # The CRDs are managed by the CRDs release
    skip_crds: true
    atomic: true
    create_namespace: true
    wait: true
    wait_timeout: "{{ traefik_wait_timeout }}"
